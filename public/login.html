<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KeepContext</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Cpath d=%27M8 1l7 7-7 7-7-7z%27 fill=%27%233157d5%27/%3E%3C/svg%3E">
</head>
<body class="login">
  <form method="post" action="/login" class="card login-card">
    <h1>KeepContext</h1>
    <p class="muted">Sign in to sync GitHub and manage shared context.</p>
    <label>Password <input type="password" name="password" autofocus required autocomplete="current-password"></label>
    <p class="error" id="err" hidden>Wrong password.</p>
    <button type="submit">Sign in</button>
  </form>
  <script>
    const err = new URLSearchParams(location.search).get('error');
    if (err === 'locked') document.getElementById('err').textContent = 'Too many failed attempts. Try again in 15 minutes.';
    if (err) document.getElementById('err').hidden = false;
  </script>
</body>
</html>
